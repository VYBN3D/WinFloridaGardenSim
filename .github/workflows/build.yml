# Builds both S3 board firmwares with arduino-cli.
# - Push to main: build only (artifacts).
# - Push a tag (v14, v15, ...): build AND publish a GitHub Release with the
#   .bin files + a version.txt manifest — what the devices' OTA check reads.
name: build-firmware

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sketch: WinFloridaGardenSim_S3
            fqbn: "esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB"
          - sketch: WinFloridaGardenSim_S28
            fqbn: "esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB"
    steps:
      - uses: actions/checkout@v4

      - name: Install arduino-cli + ESP32 core 3.3.12
        run: |
          mkdir -p ~/.local/bin
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR=~/.local/bin sh
          export PATH="$HOME/.local/bin:$PATH"
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json

      - name: Install libraries (pinned to the versions used locally)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          arduino-cli lib install "TFT_eSPI@2.5.43" "NimBLE-Arduino@1.4.0" "Adafruit NeoPixel@1.15.5" "XPT2046_Touchscreen@1.4"


      - name: Compile ${{ matrix.sketch }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p firmware/work/${{ matrix.sketch }} firmware/build/${{ matrix.sketch }}
          cp firmware/${{ matrix.sketch }}.ino firmware/work/${{ matrix.sketch }}/
          if [ -f firmware/build_opt_${{ matrix.sketch }}.h ]; then
            cp firmware/build_opt_${{ matrix.sketch }}.h firmware/work/${{ matrix.sketch }}/build_opt.h
          fi
          # PCM sample voices (boot chant + theme loop) live in headers.
          cp firmware/boot_chant.h firmware/theme_loop.h firmware/bong_hit.h firmware/work/${{ matrix.sketch }}/ 2>/dev/null || true
          arduino-cli compile \
            --fqbn "${{ matrix.fqbn }}" \
            --build-path firmware/build/${{ matrix.sketch }} \
            firmware/work/${{ matrix.sketch }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.sketch }}
          path: firmware/build/${{ matrix.sketch }}/${{ matrix.sketch }}.ino.bin

      - name: Generate browser source with Arduino's prototype preprocessor
        if: matrix.sketch == 'WinFloridaGardenSim_S3'
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          arduino-cli compile --preprocess \
            --fqbn "esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB" \
            firmware/work/WinFloridaGardenSim_S3 \
            > firmware/build/WinFloridaGardenSim_S3/webport-sketch.cpp

      - name: Upload preprocessed WebPort source
        if: matrix.sketch == 'WinFloridaGardenSim_S3'
        uses: actions/upload-artifact@v4
        with:
          name: webport-source
          path: firmware/build/WinFloridaGardenSim_S3/webport-sketch.cpp


  # The WebPort game is not a second codebase. Compile the canonical S3
  # firmware source through the browser HAL, then publish only its artifacts.
  webport:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: webport
      - uses: actions/download-artifact@v4
        with:
          name: webport-source
          path: ${{ runner.temp }}/webport-source
      - name: Compile WebPort from canonical firmware source
        run: >-
          FIRMWARE_PREPROCESSED_SOURCE="${RUNNER_TEMP}/webport-source/webport-sketch.cpp"
          scripts/build-webport.sh "$GITHUB_WORKSPACE/webport"
      - name: Publish generated emulator artifacts to gh-pages
        run: |
          cd webport
          python3 - "$GITHUB_SHA" <<'PYCODE'
          from pathlib import Path
          import re, sys
          version = sys.argv[1][:12]
          page = Path("index.html")
          html = page.read_text()
          script = f'<script src="./garden.js?v={version}"></script>'
          html, replaced = re.subn(r'<script>var createGardenSim=.*?</script>', script, html, count=1, flags=re.S)
          if not replaced:
              html, replaced = re.subn(r'<script src="\./garden\.js(?:\?v=[^"]*)?"></script>', script, html, count=1)
          if not replaced:
              raise SystemExit("Could not find the WebAssembly loader script slot in gh-pages/index.html")
          html = html.replace(
              "boards OTA-update over the air; this page updates by reloading after a release.",
              "boards OTA-update over the air; this WebPort rebuilds from the main firmware source."
          )
          page.write_text(html)
          PYCODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add garden.js garden.wasm index.html
          if ! git diff --cached --quiet; then
            git commit -m "WebPort: build from firmware ${GITHUB_SHA::7}"
            git push origin HEAD:gh-pages
          fi

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all board binaries
        uses: actions/download-artifact@v4
        with:
          path: bins

      - name: Write version manifest
        run: echo "${GITHUB_REF_NAME}" > bins/version.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bins/**/*.bin
            bins/version.txt
          body: "OTA firmware for the 4-inch S3 and 2.8-inch S3 boards. Devices check version.txt against their build tag and fetch the matching .bin."
